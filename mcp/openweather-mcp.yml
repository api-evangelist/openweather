tools:
- name: list_products
  description: 'Lists every data product the Forum serves, as the platform''s own catalogue answer: slug,
    title, lifecycle state, price in credits per call (1 credit = $0.001; the quoted price is the charged
    price), licence and attribution text, and the address of the product''s route specification. Needs
    no key and charges nothing. Call get_product next for a product''s routes and required parameters.'
- name: get_product
  description: 'Returns one product by slug: its live catalogue entry (price, licence, lifecycle state,
    the specification address) together with the routes fetch_data can call and the parameters each route
    requires, taken from the platform''s published product record. Needs no key and charges nothing. Use
    it before fetch_data — the route names come from here; an unknown slug answers with the slugs the
    catalogue serves.'
- name: sign_up
  description: 'Creates a Forum account for an email address under the Terms version currently served,
    and returns the account, its secret — the one string that runs the account, shown exactly once — and
    its first data key, shown exactly once. It grants the account no credits of its own: a new account''s
    free calls are the daily credit account of each product that gives one, spendable on that product
    alone and replaced every night, and list_products states which products give one and how much. The
    result''s configure block is the client configuration entry that sends the data key from then on;
    until the client reconnects, pass data_key.key as data_key on fetch_data. Keep the secret with the
    owner and pass it as secret on account_status and get_topup_link. An address that already has an account
    answers 409 email_exists with next_action login_to_link.'
- name: account_status
  description: 'Reads the account behind the secret: tier, accepted Terms version, the products it may
    call, the balance in credits the account bought minus the spend those credits funded, the last 30
    days of usage per day, product and key, and the 50 latest balance movements. A product''s own daily
    credits are spent before that balance and are no part of it, so a call can be served while it reads
    zero; list_products carries each product''s credit account. Pass the secret sign_up returned as the
    secret argument; the data key your client configuration sends cannot read the account and answers
    403 wrong_credential. Charges nothing; without a string the platform answers 401 invalid_key.'
- name: get_topup_link
  description: Opens a top-up for the account and returns the payment intent with hosted_url, the payment
    provider's short-lived page where a human completes the payment — no tool pays, and card details never
    touch the Forum. amount_minor is in cents; the platform accepts USD only and a minimum of 1000 (=
    $10). Pass the secret sign_up returned as the secret argument; the data key cannot open a payment.
    Asking again while a page is open returns the same page. Bought credits appear in account_status once
    the payment completes.
- name: fetch_data
  description: 'Fetches one data response: GET data.openweathermap.org/{product}/{route} with the query
    parameters you pass, using the data key from your client configuration''s Authorization header or
    the data_key argument — never the secret, which fetches nothing. A successful call is billed the product''s
    price per call; a refused call costs nothing. The result carries the payload with the platform''s
    meta block (licence and attribution) and the rate-limit headers; the balance is read with account_status,
    never from a data response. Every refusal is the platform''s error envelope unchanged — a code from
    https://agents.openweathermap.org/errors.json; 402 payment_required means the key is known but cannot
    pay for this product now, and 401 invalid_key means it is authorized for no product at all, most often
    because every credit is spent. Both carry an action_url: a human tops up there (get_topup_link returns
    the page) and the same key serves again within the engine''s build interval plus the region''s poll
    interval.'
